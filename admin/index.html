<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting — Poster Lab Store Admin</title>
  <script>
    (function(){
      var p = window.location.pathname;
      if (p && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
        window.location.replace(window.location.origin + p + '/' + window.location.search + window.location.hash);
        return;
      }
      window.location.replace('login.html');
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=login.html">
</head>
<body>
  <p><a href="login.html">Redirecting to Admin Login…</a></p>
</body>
</html>
