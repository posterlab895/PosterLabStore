<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin Login — Poster Lab Store</title>
  <meta name="description" content="Poster Lab Store admin login">
  <link rel="icon" type="image/webp" href="../assets/poster-lab-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="../styles.min.css" onerror="this.onerror=null;this.href='styles.min.css'">
  <link rel="stylesheet" href="../admin.min.css" onerror="this.onerror=null;this.href='admin.min.css'">
  <link rel="stylesheet" href="admin.min.css">
  <script>(function(){var t="light";try{t=localStorage.getItem("poster-lab-theme")||"light"}catch(e){}document.documentElement.dataset.theme=t;try{var c=document.createElement("style");c.textContent='html{color-scheme:'+(t==="dark"?"dark":"light")+'}';document.head.appendChild(c)}catch(e){}})()</script>
</head>
<body>
  <div id="adminLogin" class="admin-login-screen">
    <div style="position:absolute;top:20px;right:20px;display:flex;gap:10px;align-items:center;">
      <button id="themeToggleBtn" class="secondary-button" type="button" aria-label="Toggle theme" style="padding:8px 12px;border-radius:999px;">
        <span id="themeToggleIcon">☀</span>
      </button>
    </div>

    <div class="admin-login-card">
      <a href="../index.html" title="Poster Lab Store Home" style="display:inline-block;margin:0 auto 4px">
        <img src="../assets/poster-lab-logo.webp" alt="Poster Lab Store" class="admin-login-logo">
      </a>
      <h1>Admin Panel</h1>
      <p class="admin-login-subtitle">Authorized Access Only</p>
      
      <div class="admin-login-form" style="display:grid;gap:12px;text-align:left;">
        <div>
          <label for="adminEmail" style="display:block;font-size:0.8rem;font-weight:700;margin-bottom:4px;color:var(--muted)">Admin Email</label>
          <input type="email" id="adminEmail" placeholder="posterlab895@gmail.com" value="posterlab895@gmail.com" autocomplete="username" style="width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--field-bg);color:var(--text);font-weight:600">
        </div>
        <div>
          <label for="adminPassword" style="display:block;font-size:0.8rem;font-weight:700;margin-bottom:4px;color:var(--muted)">Password</label>
          <div style="position:relative;display:flex;align-items:center;">
            <input type="password" id="adminPassword" placeholder="Enter password" autocomplete="current-password" style="width:100%;min-height:44px;padding:0 45px 0 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--field-bg);color:var(--text);font-weight:600">
            <button type="button" id="togglePasswordBtn" aria-label="Show password" style="position:absolute;right:10px;background:none;border:none;cursor:pointer;font-size:1.1rem;padding:4px;color:var(--muted)">👁</button>
          </div>
        </div>
        <button id="adminLoginBtn" class="checkout-button" style="min-height:46px;margin-top:6px;">Login</button>
        <p id="adminLoginError" class="admin-error" hidden style="margin:4px 0 0;font-size:0.85rem;color:var(--danger);font-weight:700;text-align:center;"></p>
      </div>
      
      <a href="../index.html" class="admin-back-link" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;">
        <span>←</span> <span>Back to store</span>
      </a>
    </div>
  </div>
  <script src="../admin-login.min.js"></script>
</body>
</html>
