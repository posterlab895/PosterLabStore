<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin Login — Poster Lab Store</title>
  <meta name="description" content="Poster Lab Store admin login">
  <link rel="icon" type="image/webp" href="../assets/poster-lab-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="../styles.min.css">
  <link rel="stylesheet" href="../admin.min.css">
</head>
<body>
  <div id="adminLogin" class="admin-login-screen">
    <div class="admin-login-card">
      <img src="../assets/poster-lab-logo.webp" alt="Poster Lab Store" class="admin-login-logo">
      <h1>Admin Panel</h1>
      <p class="admin-login-subtitle">Poster Lab Store Management</p>
      <div class="admin-login-form">
        <input type="password" id="adminPassword" placeholder="Enter admin password" autocomplete="current-password">
        <button id="adminLoginBtn" class="checkout-button">Login</button>
        <p id="adminLoginError" class="admin-error" hidden>Incorrect password</p>
      </div>
      <a href="../index.html" class="admin-back-link">Back to store</a>
    </div>
  </div>
  <script src="../admin-login.min.js"></script>
</body>
</html>
